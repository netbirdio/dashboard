name: netbird-assistant-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: netbird-assistant-dev-db
    environment:
      POSTGRES_USER: netbird
      POSTGRES_PASSWORD: netbird
      POSTGRES_DB: netbird_assistant
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/10-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbird -d netbird_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The PII backstop's analyzer. Without it the backstop fails open.
  # Loopback only: the host-run agent needs it, nothing else may see it.
  presidio:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: netbird-assistant-dev-presidio
    ports:
      - "127.0.0.1:5002:3000"

configs:
  postgres_init:
    content: |
      CREATE DATABASE netbird_assistant_test OWNER netbird;

volumes:
  pgdata:
