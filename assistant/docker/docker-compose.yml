# Dev stack, such as it is: only the analyzer runs in Docker. The agent itself
# runs on the host under `bun --watch` and reaches this over loopback.
name: netbird-assistant-dev

services:

  # The PII backstop's analyzer. Without it the backstop fails open.
  # Loopback only: the host-run agent needs it, nothing else may see it.
  presidio:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    container_name: netbird-assistant-dev-presidio
    ports:
      - "127.0.0.1:5002:3000"
    # Probing /analyze rather than a liveness route: it is the call the agent
    # actually makes, so readiness includes the NLP models being loaded.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json;d=json.dumps({'text':'ping','language':'en'}).encode();urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:3000/analyze',data=d,headers={'Content-Type':'application/json'}),timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 90s
