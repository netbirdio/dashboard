name: netbird-assistant

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${ASSISTANT_IMAGE:-netbird-assistant:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://netbird:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/netbird_assistant
      PRESIDIO_URL: http://presidio:3000
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      presidio:
        condition: service_started
    logging: *logging

  # The PII backstop's analyzer. Internal only — never published.
  presidio:
    image: ${PRESIDIO_IMAGE:-ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364}
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbird
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: netbird_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbird -d netbird_assistant"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

volumes:
  pgdata:
