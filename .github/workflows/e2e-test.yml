name: Playwright E2E Tests
on:
  push:
    branches: [main]
  pull_request:
    # `edited` is included so that updating the PR description (e.g. to set
    # `management-cloud-tag: <tag>` or `reverse-proxy-tag: <tag>`) re-triggers
    # the e2e run with the new tag.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      management-cloud-tag:
        description: 'Management Cloud image tag'
        required: true
        type: string
        default: 'main'
      reverse-proxy-tag:
        description: 'Reverse Proxy image tag'
        required: true
        type: string
        default: 'main'

env:
  REGISTRY: ghcr.io
  # Number of parallel test shards. Keep this in sync with the matrix list in
  # the `playwright` job below AND the `/N` denominator on the test command.
  SHARD_TOTAL: 4

jobs:
  # ── Build the static app once, then hand it to every shard as an artifact so
  # `next build` isn't repeated N times. ────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - run: echo '{}' > .local-config.json

      - name: Build test app
        run: npx cross-env APP_ENV=test next build

      - name: Upload built app
        uses: actions/upload-artifact@v7
        with:
          name: app-out
          path: out/
          retention-days: 1

  # ── Fan out: each shard spins up its OWN docker env (isolated account) and
  # runs its slice of the suite. Serial specs stay whole (fullyParallel:false
  # shards by file), and per-shard backends mean cross-file state can't
  # collide. ─────────────────────────────────────────────────────────────────
  playwright:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download built app
        uses: actions/download-artifact@v7
        with:
          name: app-out
          path: out/

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CI_DOCKER_PULL_GITHUB_TOKEN }}

      - run: echo '{}' > .local-config.json

      - name: Install jq
        run: sudo apt-get install jq

      - name: Resolve management-cloud image tag
        id: management_tag
        env:
          INPUT_TAG: ${{ inputs.management-cloud-tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Use workflow_dispatch input if provided, otherwise parse PR body.
          # Falls back to `main` when not specified.
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(printf '%s' "$PR_BODY" \
              | grep -iE '^[[:space:]]*management-cloud-tag:[[:space:]]*[A-Za-z0-9._-]+[[:space:]]*$' \
              | head -n1 \
              | sed -E 's/^[[:space:]]*[Mm]anagement-cloud-tag:[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*$/\1/' \
              || true)
            if [ -z "$TAG" ]; then
              TAG="main"
            fi
          fi
          echo "Using management-cloud tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve reverse-proxy image tag
        id: reverse_proxy_tag
        env:
          INPUT_TAG: ${{ inputs.reverse-proxy-tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(printf '%s' "$PR_BODY" \
              | grep -iE '^[[:space:]]*reverse-proxy-tag:[[:space:]]*[A-Za-z0-9._-]+[[:space:]]*$' \
              | head -n1 \
              | sed -E 's/^[[:space:]]*[Rr]everse-proxy-tag:[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*$/\1/' \
              || true)
            if [ -z "$TAG" ]; then
              TAG="main"
            fi
          fi
          echo "Using reverse-proxy tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup test environment
        env:
          MANAGEMENT_IMAGE_TAG: ${{ steps.management_tag.outputs.tag }}
          REVERSE_PROXY_IMAGE_TAG: ${{ steps.reverse_proxy_tag.outputs.tag }}
        run: cd ./e2e/environment && bash create-test-env.sh

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        id: playwright
        run: |
          set -o pipefail
          npx playwright test --config=e2e/playwright.config.ts \
            --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} \
            2>&1 | tee playwright-output.log

      - name: Collect container logs
        if: failure()
        run: |
          cd e2e/environment
          docker compose logs management --tail=500 --no-color > management.log 2>&1 || true
          docker compose logs reverse-proxy --tail=500 --no-color > reverse-proxy.log 2>&1 || true

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: e2e/test-results/

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: management-logs-${{ matrix.shard }}
          path: e2e/environment/management.log

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: reverse-proxy-logs-${{ matrix.shard }}
          path: e2e/environment/reverse-proxy.log

  # ── Stitch every shard's blob into one HTML report + a summary table. ──────
  merge-report:
    if: ${{ !cancelled() }}
    needs: playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Download shard blobs
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blobs
          merge-multiple: true

      - name: Merge into HTML report
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Merge into JSON for the summary
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: npx playwright merge-reports --reporter json ./all-blobs || true

      - name: Append Playwright summary to job summary
        if: always() && hashFiles('merged-results.json') != ''
        run: |
          passed=$(jq '.stats.expected // 0' merged-results.json)
          failed=$(jq '.stats.unexpected // 0' merged-results.json)
          flaky=$(jq '.stats.flaky // 0' merged-results.json)
          skipped=$(jq '.stats.skipped // 0' merged-results.json)
          duration=$(jq '.stats.duration // 0' merged-results.json)
          {
            echo '### Playwright results (merged across shards)'
            echo ''
            echo "| Passed | Failed | Flaky | Skipped | Duration |"
            echo "|--------|--------|-------|---------|----------|"
            echo "| $passed | $failed | $flaky | $skipped | ${duration}ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/

      - name: Fail if any shard failed or any test failed
        if: always()
        run: |
          # A shard that died during env setup produces no blob, so its tests
          # would be silently absent from merged-results.json. Gate on the
          # matrix job result too, not just the merged failure count.
          if [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "::error::playwright matrix did not succeed (result=${{ needs.playwright.result }})"
            exit 1
          fi
          failed=$(jq '.stats.unexpected // 0' merged-results.json 2>/dev/null || echo 1)
          if [ "$failed" != "0" ]; then
            echo "::error::$failed test(s) failed across shards"
            exit 1
          fi
